# SOLIDWORKS 建模预设（原生单步工具）—— 只做一件事：把模型连到本机正在运行的 SOLIDWORKS。
#
# 这个文件提供一个预设：
#   preset-sw-native —— SOLIDWORKS 建模与绘图入口（id sw-native，清单里叫「SW 建模（原生单步）」）。
#   一次工具调用只做一个动作，同类几何可以在一次调用里用数组批量给，绝不为一张图写整段程序。
#   入口按当前工具面直接调用（catalog / model / assembly / datum / inspect / qa / workspace / ...）。
#   历史：2026-11-23 之前的 PTC 预设（id sw-ptc，run_code 整段程序入口）已删除，不再注册。
#
# 没有验收子代理：交付时的检查是程序化的（文件存在 / 字节 / 时间戳 / 当前版本有图），
# 不调用任何模型，也不再用另一个模型看图判「像不像」。
#
# preset-sw-native 的行：
#   persona            —— 唯一的一段散文：身份、这个模式怎么用、硬约束
#   mcp-sw             —— MCP 工具面（catalog/model/assembly/datum/inspect/qa/...），作用域仅限本预设
#   tool-fs            —— 只开 read / readImage：看参考图、读图记录，不写不改
#   tool-ask-user      —— 需求不清时提问
#   restrict-tools     —— 遮掉 bili 的上下文工具（compress 也在 PTC_DENY 里，一条不留）
#   command-goal       —— /goal 斜杠命令（服务在 base bundle 里）
#   tool-goal          —— 让模型能自己判断「可以交付」并结束目标
#   experience-nudge   —— 目标收尾 / 交付成功时提醒写经验
#   experience-digest  —— 会话开始把 curated 经验放进上下文
#   review-gate        —— 交付/宣布完成前，另起一个只读读图代理看一眼模型
#   compaction         —— 单条工具结果太长时裁剪（不是上下文压缩）
#   故意不给：bash、pwsh、skill、subagent、workflow、web、jobs、present、todo、planning。
#
# 为什么只留原生单步入口：两套模式会让模型在「单步」和「整段程序」之间来回退 —— 一旦能写
# 整段程序，模型就会把十几次单步调用塞回一段里，单步工具的可控性就没了。只留一个入口，
# 行为才稳定。PTC 入口已从清单删除，作废原因见 docs/ 顶部横幅。
#
# 知识为什么是普通文件而不是技能插件：dsh-skill-filesystem 注册的是 host 共享的技能表，
# 挂进预设会把 sw-* 塞进所有模式的技能目录 —— 那就是污染。改成普通文件后，
# 预设不碰任何共享注册表，模型用 read 按需打开。
#
# MCP 客户端挂在预设内而不是 Host 层：mcp-client 在「当前 registration scope」里保留
# serverName，独立 Agent scope 之间互相隔离，其它预设看不到 mcp__sw__*。
- insert:
    # 这里原本还有一条 sw-review-view（name: '@local/dsh-sw-preset'，走包的根导出）。
    # 它的入口 review-host.js 在 2026-11-17 把 3D 预览面板拆成独立插件
    # （@local/dsh-sw-3d-preview）时一并删掉了，包的根导出却一直没改：
    # 结果是每个装了这个 bundle 的 profile 都在启动时 import 一个不存在的文件
    # （实测 ERR_MODULE_NOT_FOUND: ...\dsh-sw-preset\review-host.js）。
    # 面板现在由 dsh-sw-3d-preview 自己注册 /sw3d/* 路由，这条已经没有任何消费者，
    # 2026-11-24 首推时删除。
    - id: preset-sw-native
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sw-native
        # 唯一 SW 预设：原生单步工具入口。旧的 PTC 预设（row preset-sw-ptc / id sw-ptc）已删除。
        name: SW 建模（原生单步）
        description: SOLIDWORKS 建模与绘图入口：一次工具调用只做一个动作，同类几何可在一次调用里用数组批量给；读图、规划、建模、装配、验收、交付都走原生工具。
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 SOLIDWORKS 2026 CAD 自动化代理。所有 SW 操作走原生工具：一次调用只做一个动作，同类几何可在一次调用里用数组批量给；绝不为一张图写整段程序。

                ## 这个模式怎么用

                - 开工先调一次 workspace action="preflight"（只一次），不例行查 status/instances。
                - 只读任务书里需要的那一节，不整套读；细节只按需 read 对应 SKILL.md（原生配方 native-workflows），不整套加载。
                - 改尺寸优先 model action="edit"，不整件重建。

                ## 规则

                - 建模顺序：读图 → plan → build（一次声明完整几何/尺寸/约束/语义参数）→ 回读 constraints 的 dimensions 清单 → verify → deliver。
                - build 后 dimensions 为 0 条：先报“build 未落地尺寸”，改设计定义后重建；不要用 dimensions.add 补驱动尺寸。
                - 改参数只用 model action="edit"；edit 回 mode="rebuild" 且 driven[].bound=false 时，按“无原生绑定”报告，不要重复 edit 或整件重建。
                - 接口冲突：停下并报告，不擅自改冻结约束。
                - 交付证据 = iso/front/top + 关键剖视 + 数字读数；截图不是读数。
                - 不猜签名：先查 catalog、kinds 成员清单或工具说明，再调用。
                - 尺寸只来自标注或用户确认；未标注值写进 assumptions，随交付标出。
                - 草图默认 precision="relations"；弧用真实弧与圆心关系，不用折线近似。
                - 每次几何/尺寸修改后重跑关系审计；审计缺失、被拒或版本落后不得交付。
                - 存盘导出只用 deliver；只操作本任务创建或登记的文档，归属不明就停下问。
          - id: mcp-sw
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: sw
              transport: stdio
              # 这两行是占位符：跑一次 install.ps1 会把它们换成本机真实的 node 与
              # server.mjs 绝对路径。仓库里只存占位符，因为不同机器路径不同。
              command: '<node.exe>'
              args:
                - '<repo>/server/server.mjs'
              # 默认走共享 broker：重操作提交给常驻实例 worker，首调用可自动拉起 SW。
              # 单元测试直接 spawn server.mjs，不经过这里，仍是直连路径。
              env:
                SW_MCP_BROKER: '1'
                SW_MCP_BROKER_ENSURE: '1'
                # 并行通道池：每个 designId 固定落在一条通道上，各自绑一个 SOLIDWORKS。
                SW_MCP_LANES: '4'
                SW_MCP_MAX_INSTANCES: '6'
                # 空闲 worker 的回收时间：存盘后没人用的实例 5 分钟就退出，避免实例积压。
                SW_MCP_WORKER_IDLE_MS: '300000'
              toolCallTimeoutMs: 300000
              failOnStartupError: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: prompt-surface
            name: '@local/dsh-sw-preset/prompt-surface.js'
            config:
              preset: sw-native
          - id: restrict-tools
            name: '@local/dsh-sw-preset/restrict-tools.js'
            config:
              preset: sw-native
          # 绘图会话不进 bili 的上下文压缩：bili-bypass.js 只做一件事 —— 在 sw-native 会话的
          # llm/stream 期间给模型请求加 `x-bili-plugin-bypass: 1`（按 sessionId→预设判定，
          # 未命中不加头）；它不注册/还原任何工具，工具面由 restrict-tools 管。只加引用，不加 config。
          - id: bili-bypass
            name: '@local/dsh-sw-preset/bili-bypass.js'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: experience-nudge
            name: '@local/dsh-sw-preset/experience-nudge.js'
          - id: experience-digest
            name: '@local/dsh-sw-preset/experience-digest.js'
          - id: review-gate
            name: '@local/dsh-sw-preset/review-gate.js'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
